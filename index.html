/* --- ANNEAU JOUEUR & TIMER TRANSPARENT (CONTOUR SEULEMENT) --- */
.player-ring-wrapper {
  position: relative;
  width: 92px;
  height: 92px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.player-ring-img {
  position: absolute;
  inset: -6px;
  background: url('19952.jpg') center/cover no-repeat;
  mix-blend-mode: multiply; /* Rend le blanc de l'image transparent */
  pointer-events: none;
  z-index: 3;
}
.player-timer-ring {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  z-index: 2;
  pointer-events: none;
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #fff calc(100% - 6px));
  mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #fff calc(100% - 6px));
  background: conic-gradient(var(--timer-col, rgba(24, 128, 73, 0.45)) calc(var(--progress, 1) * 360deg), transparent 0deg);
  transition: background-color 0.3s ease;
}
@keyframes timer10s {
  from { --progress: 1; }
  to { --progress: 0; }
}
@keyframes timerColSwitch {
  0% { --timer-col: rgba(24, 128, 73, 0.45); }     /* Vert transparent */
  70% { --timer-col: rgba(214, 58, 47, 0.6); }     /* Rouge transparent aux 3 dernières secondes */
  100% { --timer-col: rgba(214, 58, 47, 0.6); }
}

/* --- BOUTON FEINTE (15 SECONDES & ROUGE TRANSPARENT) --- */
.btn-feinte {
  position: relative;
  overflow: hidden;
  background: rgba(214, 58, 47, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #fff;
}
.btn-feinte.cooldown::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(214, 58, 47, 0.55);
  pointer-events: none;
  animation: feinteCd 15s linear forwards;
}
@keyframes feinteCd {
  from { width: 100%; }
  to { width: 0%; }
}

@keyframes tsout{to{opacity:0;transform:translateY(-10px)}}

@keyframes trem{0%,100%{transform:translateY(0) rotate(-7deg)}50%{transform:translateY(-16px) rotate(7deg)}}

@keyframes bye{to{transform:translateX(-170px) rotate(-40deg);opacity:0}}
@keyframes shake{25%{transform:translate(-6px,4px)}50%{transform:translate(6px,-4px)}75%{transform:translate(-4px,-3px)}}
@keyframes spin{to{transform:rotate(-760deg) scale(.2);opacity:.2}}
@keyframes sink{0%{transform:rotate(var(--a)) translateX(120px)}100%{transform:rotate(calc(var(--a) + 540deg)) translateX(0) scale(0)}}
