<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a3a20">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Kilo de merde</title>
<style>
:root{--card:#fbf7ec;--gold:#f6b82e;--red:#d63a2f;--back:repeating-linear-gradient(45deg,#7a2e12,#7a2e12 4px,#9a431f 4px,#9a431f 8px);--f1:#188049;--f2:#0b4a29}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:#0a3a20;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif}
body{display:flex;flex-direction:column;position:fixed;inset:0;overflow:hidden;background:#1a1410 url(table.jpg) 50% 50%/cover no-repeat}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.ib{background:#000a;border:2px solid #fff4;border-radius:10px;color:#fff;padding:3px 9px;font-size:15px}
#gh{display:flex;align-items:center;gap:8px;height:34px;flex:0 0 auto;padding:2px max(8px,env(safe-area-inset-right)) 2px max(8px,env(safe-area-inset-left));background:linear-gradient(#000c,#0000);position:relative;z-index:3}
#gh>b{font-size:14px;color:var(--gold);white-space:nowrap}
#gh .pf{flex:1;max-width:250px;margin-left:auto}
#room{position:relative;flex:1;min-height:0;margin:2px 6px}

/* --- STYLE DU CONTOUR JOUEUR / ANNEAU & TIMER --- */
.player-avatar-container {
  position: relative;
  width: 90px;
  height: 90px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Image de l'anneau (rend le blanc de l'image transparent) */
.player-ring {
  position: absolute;
  inset: -6px; /* Ajuste la taille relative du cadre autour de l'avatar */
  background: url('19952.jpg') center/cover no-repeat;
  mix-blend-mode: multiply; /* Rend le fond blanc de l'image totalement transparent */
  pointer-events: none;
  z-index: 3;
}

/* Avatar/Photo du joueur à l'intérieur */
.player-avatar {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  object-fit: cover;
  z-index: 1;
}

/* Jauge circulaire de décompte de 10 secondes */
.turn-timer-overlay {
  position: absolute;
  inset: 4px;
  border-radius: 50%;
  z-index: 2;
  pointer-events: none;
  /* Masque en cercle pour l'effet d'horloge */
  background: conic-gradient(var(--timer-color, rgba(24, 128, 73, 0.4)) calc(var(--progress, 1) * 360deg), transparent 0deg);
  transition: background-color 0.3s ease;
}

/* Animation de 10 secondes */
.turn-timer-active {
  animation: timer10s 10s linear forwards, timerColorSwitch 10s step-end forwards;
}

@keyframes timer10s {
  from { --progress: 1; }
  to { --progress: 0; }
}

/* Changement de couleur : Vert transparent -> Rouge transparent à 3 secondes de la fin (soit à 70% de 10s) */
@keyframes timerColorSwitch {
  0% { --timer-color: rgba(24, 128, 73, 0.4); } /* Vert transparent */
  70% { --timer-color: rgba(214, 58, 47, 0.6); } /* Rouge transparent pour les 3 dernières secondes */
  100% { --timer-color: rgba(214, 58, 47, 0.6); }
}

/* Bouton Feinte */
.btn-feinte {
  position: relative;
  overflow: hidden;
  background: rgba(214, 58, 47, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #fff;
}
.btn-feinte.cooldown::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(214, 58, 47, 0.55);
  pointer-events: none;
  animation: feinteCd 15s linear forwards;
}
@keyframes feinteCd {
  from { width: 100%; }
  to { width: 0%; }
}
</style>
</head>
<body>

  <!-- EXEMPLE D'UTILISATION POUR UN JOUEUR -->
  <div class="player-avatar-container">
    <!-- Image de l'anneau -->
    <div class="player-ring"></div>
    
    <!-- Superposition de décompte transparent (Vert puis Rouge à 3s) -->
    <div class="turn-timer-overlay turn-timer-active" id="playerTimer"></div>
    
    <!-- Photo/Avatar du joueur -->
    <img src="avatar-placeholder.png" alt="Joueur" class="player-avatar">
  </div>

</body>
<script>
  // Inscription de la propriété CSS personnalisée pour l'animation fluide de la jauge
  if (window.CSS && CSS.registerProperty) {
    CSS.registerProperty({
      name: '--progress',
      syntax: '<number>',
      inherits: false,
      initialValue: 1
    });
  }

  // Fonction pour relancer le timer de 10s sur un joueur
  function startPlayerTimer(elementId) {
    const timerEl = document.getElementById(elementId);
    if (!timerEl) return;
    
    timerEl.classList.remove('turn-timer-active');
    void timerEl.offsetWidth; // Reclic / retrigger reflow CSS
    timerEl.classList.add('turn-timer-active');
  }
</script>
</html>
