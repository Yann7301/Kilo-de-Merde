<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a3a20">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>Kilo de merde</title>
<style>
:root{--card:#fbf7ec;--gold:#f6b82e;--red:#d63a2f;--back:repeating-linear-gradient(45deg,#7a2e12,#7a2e12 4px,#9a431f 4px,#9a431f 8px);--f1:#188049;--f2:#0b4a29}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;touch-action:manipulation;overscroll-behavior:none;-webkit-text-size-adjust:100%;background:#0a3a20;color:#fff;font-family:"Trebuchet MS",system-ui,sans-serif}
body{display:flex;flex-direction:column;position:fixed;inset:0;overflow:hidden;background:#1a1410 url(table.jpg) 50% 50%/cover no-repeat}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.ib{background:#000a;border:2px solid #fff4;border-radius:10px;color:#fff;padding:3px 9px;font-size:15px}
#gh{display:flex;align-items:center;gap:8px;height:34px;flex:0 0 auto;padding:2px max(8px,env(safe-area-inset-right)) 2px max(8px,env(safe-area-inset-left));background:linear-gradient(#000c,#0000);position:relative;z-index:3}
#gh>b{font-size:14px;color:var(--gold);white-space:nowrap}
#gh .pf{flex:1;max-width:250px;margin-left:auto}
#room{position:relative;flex:1;min-height:0;margin:2px 6px}
.pl{position:fixed;transform:translate(-50%,-50%);z-index:1;display:flex;flex-direction:column-reverse;align-items:center;gap:13px;font-size:0}
.stk{position:relative;width:44px;height:62px}
.stk i{position:absolute;inset:0;border-radius:7px;background:var(--back);border:2px solid var(--card)}
.stk i:nth-child(1){transform:translate(-4px,-3px) rotate(-5deg)}.stk i:nth-child(2){transform:translate(3px,-1px) rotate(4deg)}
.stk b{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:#000b;border:1px solid var(--gold);border-radius:10px;padding:0 8px;font-size:12px;white-space:nowrap}
.stk b::before{content:"💩 "}
.stk.ok{animation:blinkstk .45s infinite alternate}
#tas{pointer-events:auto;cursor:pointer}
#mc{position:fixed;transform:translate(-50%,-50%);z-index:2;width:156px;display:flex;flex-direction:column;align-items:center;gap:5px}
#lc{position:fixed;transform:translate(-50%,-50%);z-index:2;width:150px;display:flex;flex-direction:column;align-items:center;gap:6px}
#msg{font-size:12px;line-height:1.3;text-align:center;background:#000b;border-radius:10px;padding:3px 8px}
#msg:empty{display:none}
#gv{background:var(--gold);color:#222;border:0;border-radius:10px;padding:6px 12px;font-weight:800;font-size:13px;box-shadow:0 3px 0 #a97a10}
#opps{position:fixed;inset:0;pointer-events:none}

/* Bouton feinte et son overlay rouge transparent */
.btn-feinte {
  position: relative;
  overflow: hidden;
  background: rgba(214, 58, 47, 0.3); /* Rouge léger transparent par défaut */
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #fff;
}

/* Effet de remplissage / overlay du cooldown du bouton feinte en rouge semi-transparent */
.btn-feinte.cooldown::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(214, 58, 47, 0.55); /* Rouge transparent qui laisse apercevoir le bouton */
  pointer-events: none;
  animation: feinteCd 15s linear forwards;
}

@keyframes feinteCd {
  from { width: 100%; }
  to { width: 0%; }
}
</style>
</head>
<body>
  <!-- Structure HTML de ton jeu -->
</body>
<script>
  // Exemple de valeur modifiée pour le temporisateur de feinte
  const FEINTE_COOLDOWN = 15; // Passé de 10 à 15 secondes
</script>
</html>
